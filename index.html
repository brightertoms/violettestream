<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Violette · Streaming privé</title>
<style>
:root{--bg:#0a0610;--c:#140d20;--l:#2b1f42;--v:#8b5cf6;--t:#ece6f7;--m:#9d90b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:6px;padding:14px 24px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#0a0610ee;z-index:5;flex-wrap:wrap}
.logo{font:italic 700 24px Georgia,serif;color:var(--v);margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--m);padding:8px 12px;cursor:pointer;border-radius:8px}
nav button:hover,nav button.on{color:var(--t);background:var(--l)}
.btn{background:var(--v);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:wait}
.btn.s{background:var(--l)}.btn.d{background:#7f1d1d}.btn.sm{padding:4px 10px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:24px}
h2{font:italic 700 26px Georgia,serif;margin:0 0 16px}
.box{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:22px;margin-bottom:20px}
.auth{max-width:400px;margin:6vh auto}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:10px;margin:6px 0 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--v)}
label{color:var(--m);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{border-radius:12px;overflow:hidden;background:var(--c);border:1px solid var(--l);cursor:pointer}
.card:hover{border-color:var(--v)}
.th{height:130px;display:flex;align-items:center;justify-content:center;font-size:40px}
.i{padding:12px}.i b{display:block}.i small{color:var(--m)}
.drop{border:2px dashed var(--l);border-radius:12px;padding:30px;text-align:center;color:var(--m);cursor:pointer}
.drop.h{border-color:var(--v);color:var(--t)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;background:var(--l)}
.msg.e{background:#450a0a;color:#fecaca}.msg.o{background:#052e16;color:#bbf7d0}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;overflow:auto}
.modal>div{max-width:900px;width:100%}
video{width:100%;border-radius:12px;background:#000;max-height:68vh}
.hide{display:none!important}
</style></head><body>
<header><span class="logo">Violette</span><nav id="nav" class="hide"></nav></header>
<main><div id="fl"></div><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),S=window.crypto&&crypto.subtle;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n)),G=iv=>({name:'AES-GCM',iv});
const RSA={name:'RSA-OAEP',hash:'SHA-256'},AES={name:'AES-GCM',length:256};
const val=id=>($('#'+id)||{value:''}).value,mo=n=>(n/1048576).toFixed(1)+' Mo';
let me=null,picked=null;

/* ---------- Base de données locale (IndexedDB) ---------- */
const DB=new Promise((ok,ko)=>{const r=indexedDB.open('violette',1);
 r.onupgradeneeded=()=>['users','videos','blobs'].forEach(n=>r.result.createObjectStore(n,{keyPath:n==='users'?'u':'id'}));
 r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const q=async(s,m,f)=>{const d=await DB;return new Promise((ok,ko)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=()=>ko(t.error)})};
const get=(s,k)=>q(s,'readonly',o=>o.get(k)),all=s=>q(s,'readonly',o=>o.getAll()),put=(s,v)=>q(s,'readwrite',o=>o.put(v)),del=(s,k)=>q(s,'readwrite',o=>o.delete(k));

/* ---------- Chiffrement ----------
 Clé de bibliothèque (LK) -> chiffre la clé de chaque vidéo.
 Chaque utilisateur a une paire RSA : la clé privée est protégée par son mot de passe (PBKDF2 + AES-GCM),
 et le développeur "ouvre" l'accès à la LK pour un membre en la chiffrant avec sa clé publique. */
const kek=async(p,salt)=>S.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},await S.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),AES,false,['wrapKey','unwrapKey']);
const wrapPriv=async(priv,p)=>{const salt=rnd(16),iv=rnd(12);return{salt,iv,wp:await S.wrapKey('pkcs8',priv,await kek(p,salt),G(iv))}};
const unwrapPriv=async(u,p)=>S.unwrapKey('pkcs8',u.wp,await kek(p,u.salt),G(u.iv),RSA,true,['unwrapKey']);

async function mkUser(u,p,role,LK){
 const kp=await S.generateKey({...RSA,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,['wrapKey','unwrapKey']);
 const r={u,role,st:LK?'ok':'wait',pub:await S.exportKey('spki',kp.publicKey),...await wrapPriv(kp.privateKey,p),d:Date.now()};
 if(LK)r.lk=await S.wrapKey('raw',LK,kp.publicKey,RSA);
 await put('users',r)}

async function login(u,p){
 const r=await get('users',u.trim().toLowerCase());
 if(!r)throw Error('Identifiant ou mot de passe incorrect.');
 let priv;try{priv=await unwrapPriv(r,p)}catch{throw Error('Identifiant ou mot de passe incorrect.')}
 if(r.st==='blocked')throw Error('Ce compte est bloqué.');
 if(r.st==='wait')throw Error('Compte en attente de validation par le développeur.');
 const LK=await S.unwrapKey('raw',r.lk,priv,RSA,AES,true,['wrapKey','unwrapKey']);
 me={u:r.u,role:r.role,priv,LK}}

async function publish(f,title,desc,cb){
 const CK=await S.generateKey(AES,true,['encrypt','decrypt']),iv=rnd(12),ivk=rnd(12),id=crypto.randomUUID();
 cb('Lecture du fichier…');const buf=await f.arrayBuffer();
 cb('Chiffrement…');const data=await S.encrypt(G(iv),CK,buf),wk=await S.wrapKey('raw',CK,me.LK,G(ivk));
 cb('Enregistrement…');
 await put('blobs',{id,data});
 await put('videos',{id,t:title,d:desc,mime:f.type||'video/mp4',iv,ivk,wk,size:f.size,at:Date.now()})}

async function play(id){
 const v=await get('videos',id),b=await get('blobs',id);
 const CK=await S.unwrapKey('raw',v.wk,me.LK,G(v.ivk),AES,false,['decrypt']);
 const url=URL.createObjectURL(new Blob([await S.decrypt(G(v.iv),CK,b.data)],{type:v.mime}));
 const m=document.createElement('div');m.className='modal';m.id='mo';m.dataset.url=url;
 m.innerHTML=`<div><video controls autoplay src="${url}"></video><h2 style="margin-top:14px">${esc(v.t)}</h2><p style="color:var(--m)">${esc(v.d||'')}</p><button class="btn s" data-a="close">Fermer</button></div>`;
 document.body.appendChild(m)}
function closeM(){const m=$('#mo');if(!m)return;const vd=m.querySelector('video');vd.pause();vd.removeAttribute('src');URL.revokeObjectURL(m.dataset.url);m.remove()}

/* ---------- Interface ---------- */
const flash=(t,k='e')=>$('#fl').innerHTML=t?`<div class="msg ${k}">${esc(t)}</div>`:'';
const hue=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return`background:linear-gradient(135deg,hsl(${h} 55% 28%),hsl(${(h+50)%360} 60% 10%))`};
function nav(v){const n=$('#nav');n.classList.remove('hide');
 n.innerHTML=`<button class="${v==='home'?'on':''}" data-a="home">Catalogue</button>${me.role==='admin'?`<button class="${v==='admin'?'on':''}" data-a="admin">Développeur</button>`:''}<button class="${v==='acc'?'on':''}" data-a="acc">Compte</button><button data-a="logout">Déconnexion (${esc(me.u)})</button>`}

function authV(mode){
 $('#nav').classList.add('hide');const setup=mode==='setup';
 $('#v').innerHTML=`<div class="box auth"><h2>${setup?'Compte développeur':mode==='up'?'Inscription':'Connexion'}</h2>
 ${setup?'<div class="msg">Première ouverture : crée ici ton compte développeur. Il te permettra d’ajouter des vidéos et de gérer les inscrits.</div>':`<div class="tabs"><button class="btn ${mode==='in'?'':'s'}" data-a="m-in">Connexion</button><button class="btn ${mode==='up'?'':'s'}" data-a="m-up">Inscription</button></div>`}
 <label>Identifiant</label><input id="u" autocomplete="username"><label>Mot de passe (8 caractères minimum)</label><input id="p" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}">
 ${mode==='in'?'':'<label>Confirmer le mot de passe</label><input id="p2" type="password" autocomplete="new-password">'}
 <button class="btn" id="go" style="width:100%" data-a="${setup?'setup':mode==='up'?'signup':'signin'}">${setup?'Créer le compte':mode==='up'?'Créer mon compte':'Se connecter'}</button></div>`}

async function homeV(){nav('home');
 const vs=(await all('videos')).sort((a,b)=>b.at-a.at);
 $('#v').innerHTML=`<h2>Catalogue</h2>${vs.length?`<div class="grid">${vs.map(v=>`<div class="card" data-a="play" data-id="${v.id}"><div class="th" style="${hue(v.id)}">▶</div><div class="i"><b>${esc(v.t)}</b><small>${esc((v.d||'').slice(0,90))}</small></div></div>`).join('')}</div>`:`<div class="box">Aucune vidéo pour l’instant.${me.role==='admin'?' Ouvre l’onglet Développeur pour en publier une.':''}</div>`}`}

const stl={ok:'Actif',wait:'En attente',blocked:'Bloqué'};
const urow=x=>`<tr><td>${esc(x.u)}</td><td>${x.role==='admin'?'Développeur':'Membre'}</td><td>${stl[x.st]}</td><td>${new Date(x.d).toLocaleDateString('fr-FR')}</td><td>${x.u===me.u?'':`${x.st==='wait'?`<button class="btn sm" data-a="uok" data-id="${x.u}">Approuver</button> `:''}<button class="btn s sm" data-a="ublock" data-id="${x.u}">${x.st==='blocked'?'Débloquer':'Bloquer'}</button> <button class="btn d sm" data-a="udel" data-id="${x.u}">Supprimer</button>`}</td></tr>`;

async function adminV(){nav('admin');picked=null;
 const vs=(await all('videos')).sort((a,b)=>b.at-a.at),us=(await all('users')).sort((a,b)=>b.d-a.d);
 $('#v').innerHTML=`<div class="box"><h2>Publier une vidéo</h2><div class="drop" id="dz">Glisse une vidéo ici ou clique pour la choisir</div><input type="file" id="fi" accept="video/*" class="hide">
 <label style="display:block;margin-top:14px">Titre</label><input id="vt"><label>Description</label><textarea id="vd" rows="3"></textarea>
 <button class="btn" data-a="pub">Publier</button> <small id="ps" style="color:var(--m)"></small></div>
 <div class="box"><h2>Vidéos (${vs.length})</h2>${vs.length?`<div class="tw"><table>${vs.map(v=>`<tr><td>${esc(v.t)}</td><td>${mo(v.size)}</td><td><button class="btn d sm" data-a="vdel" data-id="${v.id}">Supprimer</button></td></tr>`).join('')}</table></div>`:'Aucune vidéo publiée.'}</div>
 <div class="box"><h2>Inscrits (${us.length})</h2><div class="tw"><table><tr><th>Identifiant</th><th>Rôle</th><th>Statut</th><th>Inscrit le</th><th></th></tr>${us.map(urow).join('')}</table></div></div>`;
 const dz=$('#dz'),fi=$('#fi');
 const pick=f=>{if(!f)return;picked=f;dz.textContent='📁 '+f.name+' ('+mo(f.size)+')';if(!$('#vt').value)$('#vt').value=f.name.replace(/\.[^.]+$/,'')};
 dz.onclick=()=>fi.click();fi.onchange=()=>pick(fi.files[0]);
 dz.ondragover=e=>{e.preventDefault();dz.classList.add('h')};dz.ondragleave=()=>dz.classList.remove('h');
 dz.ondrop=e=>{e.preventDefault();dz.classList.remove('h');pick(e.dataTransfer.files[0])}}

function accV(){nav('acc');
 $('#v').innerHTML=`<div class="box" style="max-width:420px"><h2>Mon compte</h2><p style="color:var(--m)">Connecté en tant que <b style="color:var(--t)">${esc(me.u)}</b> (${me.role==='admin'?'développeur':'membre'}).</p>
 <label>Mot de passe actuel</label><input id="o" type="password" autocomplete="current-password"><label>Nouveau mot de passe</label><input id="n" type="password" autocomplete="new-password"><label>Confirmer le nouveau mot de passe</label><input id="n2" type="password" autocomplete="new-password">
 <button class="btn" id="go" data-a="chpw">Changer le mot de passe</button></div>`}

const checkPw=(p,p2)=>{if(p.length<8)throw Error('Le mot de passe doit faire au moins 8 caractères.');if(p!==p2)throw Error('Les deux mots de passe ne correspondent pas.')};
const checkId=u=>{if(!/^[a-z0-9._-]{3,24}$/.test(u))throw Error('Identifiant : 3 à 24 caractères (lettres, chiffres, . _ -).')};

async function act(a,id,el){
 flash('');if(el)el.disabled=true;
 try{switch(a){
  case'm-in':authV('in');break;
  case'm-up':authV('up');break;
  case'signin':await login(val('u'),val('p'));await homeV();break;
  case'signup':{const u=val('u').trim().toLowerCase();checkId(u);checkPw(val('p'),val('p2'));
   if(await get('users',u))throw Error('Cet identifiant est déjà pris.');
   await mkUser(u,val('p'),'user',null);authV('in');flash('Compte créé. Le développeur doit valider ton accès avant ta première connexion.','o');break}
  case'setup':{const u=val('u').trim().toLowerCase();checkId(u);checkPw(val('p'),val('p2'));
   await mkUser(u,val('p'),'admin',await S.generateKey(AES,true,['wrapKey','unwrapKey']));
   await login(u,val('p'));await adminV();break}
  case'logout':closeM();me=null;await boot();break;
  case'home':await homeV();break;
  case'admin':await adminV();break;
  case'acc':accV();break;
  case'play':await play(id);break;
  case'close':closeM();break;
  case'pub':{if(!picked)throw Error('Choisis d’abord une vidéo.');const t=val('vt').trim();if(!t)throw Error('Ajoute un titre.');
   if(picked.size>4e8)throw Error('Fichier trop gros : 400 Mo maximum.');
   await publish(picked,t,val('vd').trim(),s=>$('#ps').textContent=s);await adminV();flash('Vidéo publiée.','o');break}
  case'vdel':if(confirm('Supprimer cette vidéo ?')){await del('videos',id);await del('blobs',id);await adminV()}break;
  case'uok':{const r=await get('users',id),k=await S.importKey('spki',r.pub,RSA,false,['wrapKey']);
   r.lk=await S.wrapKey('raw',me.LK,k,RSA);r.st='ok';await put('users',r);await adminV();flash('Accès accordé à '+id+'.','o');break}
  case'ublock':{const r=await get('users',id);r.st=r.st==='blocked'?(r.lk?'ok':'wait'):'blocked';await put('users',r);await adminV();break}
  case'udel':if(confirm('Supprimer le compte '+id+' ?')){await del('users',id);await adminV()}break;
  case'chpw':{const n=val('n');checkPw(n,val('n2'));const r=await get('users',me.u);
   try{await unwrapPriv(r,val('o'))}catch{throw Error('Le mot de passe actuel est incorrect.')}
   Object.assign(r,await wrapPriv(me.priv,n));await put('users',r);accV();flash('Mot de passe modifié.','o');break}
 }}catch(e){flash(e.message||'Une erreur est survenue.')}
 if(el)el.disabled=false}

document.addEventListener('click',e=>{
 if(e.target.id==='mo')return closeM();
 const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&$('#go'))$('#go').click();if(e.key==='Escape')closeM()});

async function boot(){
 if(!S){$('#v').innerHTML='<div class="box auth">Ce navigateur ne permet pas le chiffrement. Ouvre la page en HTTPS ou depuis un fichier local.</div>';return}
 try{authV((await all('users')).some(x=>x.role==='admin')?'in':'setup')}
 catch{$('#v').innerHTML='<div class="box auth">Le stockage local est indisponible (navigation privée ?). Ouvre la page dans une fenêtre normale.</div>'}}
boot();
</script></body></html>
