<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Violette · Streaming privé</title>
<style>
:root{--bg:#0a0610;--c:#140d20;--l:#2b1f42;--v:#8b5cf6;--t:#ece6f7;--m:#9d90b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:6px;padding:14px 24px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#0a0610ee;z-index:5;flex-wrap:wrap}
.logo{font:italic 700 24px Georgia,serif;color:var(--v);margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--m);padding:8px 12px;cursor:pointer;border-radius:8px}
nav button:hover,nav button.on{color:var(--t);background:var(--l)}
.btn{background:var(--v);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:wait}
.btn.s{background:var(--l)}.btn.d{background:#7f1d1d}.btn.sm{padding:4px 10px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:24px}
h2{font:italic 700 26px Georgia,serif;margin:0 0 16px}
.box{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:22px;margin-bottom:20px}
.auth{max-width:400px;margin:6vh auto}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:10px;margin:6px 0 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--v)}
label{color:var(--m);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{border-radius:12px;overflow:hidden;background:var(--c);border:1px solid var(--l);cursor:pointer}
.card:hover{border-color:var(--v)}
.th{display:flex;align-items:center;justify-content:center;font-size:40px;width:100%;aspect-ratio:2/3;object-fit:cover;display:block}.th:not(img){display:flex}
.i{padding:12px}.i b{display:block}.i small{color:var(--m)}
.drop{border:2px dashed var(--l);border-radius:12px;padding:30px;text-align:center;color:var(--m);cursor:pointer}
.drop.h{border-color:var(--v);color:var(--t)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;background:var(--l)}
.msg.e{background:#450a0a;color:#fecaca}.msg.o{background:#052e16;color:#bbf7d0}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;overflow:auto}
.modal>div{max-width:900px;width:100%}
video{width:100%;border-radius:12px;background:#000;max-height:68vh}
.stp p{color:var(--m);margin:0 0 12px}.stp .btn{margin-top:6px}
.hide{display:none!important}
</style></head><body>
<header><span class="logo">Violette</span><nav id="nav" class="hide"></nav></header>
<main><div id="fl"></div><div id="v"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),S=window.crypto&&crypto.subtle;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n)),G=iv=>({name:'AES-GCM',iv});
const RSA={name:'RSA-OAEP',hash:'SHA-256'},AES={name:'AES-GCM',length:256};
const val=id=>($('#'+id)||{value:''}).value,mo=n=>(n/1048576).toFixed(1)+' Mo';
let me=null,picked=null;
const sb=window.supabase&&supabase.createClient('https://kpbprllxvhyhznqbuafu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwYnBybGx4dmh5aHpucWJ1YWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTE4MTYsImV4cCI6MjEwNjQ2NzgxNn0.l-epqsNYmxu_RP-pJRcZewS1fAY8E-Dii5I1rPTNrh8',{auth:{persistSession:false}}),CH=16*1048576,CDN='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/* ---------- Stockage local (hors ligne) ---------- */
const DB=new Promise((ok,ko)=>{const r=indexedDB.open('violette',2);
 r.onupgradeneeded=()=>{const d=r.result;[['prof','u'],['vm','id'],['dl','k']].forEach(([n,k])=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:k}))};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const q=async(s,m,f)=>{const d=await DB;return new Promise((ok,ko)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=()=>ko(t.error)})};
const get=(s,k)=>q(s,'readonly',o=>o.get(k)),all=s=>q(s,'readonly',o=>o.getAll()),put=(s,v)=>q(s,'readwrite',o=>o.put(v)),del=(s,k)=>q(s,'readwrite',o=>o.delete(k));
const cover=f=>new Promise((ok,ko)=>{const i=new Image(),u=URL.createObjectURL(f);i.onerror=()=>ko(Error('Image illisible.'));
 i.onload=()=>{const k=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.src=u});

/* ---------- Chiffrement ----------
 Clé de bibliothèque (LK) -> chiffre la clé de chaque vidéo.
 Chaque utilisateur a une paire RSA : la clé privée est protégée par son mot de passe (PBKDF2 + AES-GCM),
 et le développeur "ouvre" l'accès à la LK pour un membre en la chiffrant avec sa clé publique. */
const kek=async(p,salt)=>S.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},await S.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),AES,false,['wrapKey','unwrapKey']);
const wrapPriv=async(priv,p)=>{const salt=rnd(16),iv=rnd(12);return{salt,iv,wp:await S.wrapKey('pkcs8',priv,await kek(p,salt),G(iv))}};
const unwrapPriv=async(u,p)=>S.unwrapKey('pkcs8',u.wp,await kek(p,u.salt),G(u.iv),RSA,true,['unwrapKey']);

const vids=async()=>{const{data,error}=await sb.from('videos').select('id,title,descr,size,cover,created_at').order('created_at',{ascending:false});if(error)throw Error(error.message);return data.map(v=>({...v,t:v.title,d:v.descr}))};
const usrs=async()=>{const{data,error}=await sb.from('profiles').select('id,username,role,st,created_at').order('created_at',{ascending:false});if(error)throw Error(error.message);return data.map(x=>({...x,u:x.username,d:new Date(x.created_at).getTime()}))};
const em=u=>u+'@violette.app';
const authPw=async(u,p)=>[...new Uint8Array(await S.deriveBits({name:'PBKDF2',salt:enc.encode('violette-auth:'+u),iterations:310000,hash:'SHA-256'},await S.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']),256))].map(x=>x.toString(16).padStart(2,'0')).join('');

async function mkUser(u,p){
 const{data:a,error}=await sb.auth.signUp({email:em(u),password:await authPw(u,p)});
 if(error)throw Error(/regist|exist/i.test(error.message)?'Cet identifiant est déjà pris.':error.message);
 if(!a.session)throw Error('Dans Supabase, désactive « Confirm email » (Authentication → Providers → Email).');
 const kp=await S.generateKey({...RSA,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,['wrapKey','unwrapKey']),w=await wrapPriv(kp.privateKey,p),id=a.user.id;
 let r=await sb.from('profiles').insert({id,username:u,pub:b64(await S.exportKey('spki',kp.publicKey)),wp:b64(w.wp),salt:b64(w.salt),iv:b64(w.iv)});
 if(r.error)throw Error(r.error.message);
 r=await sb.from('profiles').select('role').eq('id',id).single();
 if(r.data&&r.data.role==='admin'){const LK=await S.generateKey(AES,true,['wrapKey','unwrapKey']);
  await sb.from('profiles').update({lk:b64(await S.wrapKey('raw',LK,kp.publicKey,RSA))}).eq('id',id)}
 await sb.auth.signOut()}

async function offLogin(u,p){
 const c=await get('prof',u);
 if(!c)throw Error('Hors ligne : connecte-toi d’abord une fois avec internet.');
 if(Date.now()-c.at>2592e6)throw Error('Accès hors ligne expiré (30 jours) : reconnecte-toi avec internet.');
 let priv;try{priv=await unwrapPriv({wp:unb64(c.wp),salt:unb64(c.salt),iv:unb64(c.iv)},p)}catch{throw Error('Identifiant ou mot de passe incorrect.')}
 me={u:c.username,id:c.id,role:c.role,off:true,priv,LK:await S.unwrapKey('raw',unb64(c.lk),priv,RSA,AES,true,['wrapKey','unwrapKey'])}}

async function login(u,p){
 u=u.trim().toLowerCase();if(!navigator.onLine||!sb)return offLogin(u,p);
 const{data,error}=await sb.auth.signInWithPassword({email:em(u),password:await authPw(u,p)});
 if(error){if(/fetch|network|retry/i.test(error.name+error.message))return offLogin(u,p);throw Error('Identifiant ou mot de passe incorrect.')}
 const{data:r}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
 const bad=m=>{sb.auth.signOut();throw Error(m)};
 if(!r)bad('Compte introuvable.');
 if(r.st==='blocked')bad('Ce compte est bloqué.');
 if(r.st==='wait'||!r.lk)bad('Compte en attente de validation par le développeur.');
 let priv;try{priv=await unwrapPriv({wp:unb64(r.wp),salt:unb64(r.salt),iv:unb64(r.iv)},p)}catch{bad('Identifiant ou mot de passe incorrect.')}
 const LK=await S.unwrapKey('raw',unb64(r.lk),priv,RSA,AES,true,['wrapKey','unwrapKey']);
 me={u:r.username,id:r.id,role:r.role,priv,LK};await put('prof',{...r,u:r.username,at:Date.now()})}

async function pool(n,items,fn){let k=0;await Promise.all(Array.from({length:n},async()=>{while(k<items.length)await fn(items[k++])}))}
async function publish(f,title,desc,cv,cb){
 const CK=await S.generateKey(AES,true,['encrypt','decrypt']),ivk=rnd(12),id=crypto.randomUUID(),n=Math.ceil(f.size/CH)||1;
 let dn=0;const t0=Date.now();
 await pool(3,[...Array(n).keys()],async i=>{
  const iv=rnd(12),blob=new Blob([iv,await S.encrypt(G(iv),CK,await f.slice(i*CH,(i+1)*CH).arrayBuffer())]);
  let error;for(let t=0;t<3;t++){({error}=await sb.storage.from('videos').upload(id+'/'+i,blob,{contentType:'application/octet-stream'}));if(!error||/duplicate|exists/i.test(error.message)){error=null;break}}
  if(error)throw Error(error.message);
  cb(`Envoi ${Math.round(++dn/n*100)} % · ${(Math.min(dn*CH,f.size)/1048576/((Date.now()-t0)/1000)).toFixed(1)} Mo/s`)});
 const{error}=await sb.from('videos').insert({id,title,descr:desc,cover:cv,mime:f.type||'video/mp4',size:f.size,ivk:b64(ivk),wk:b64(await S.wrapKey('raw',CK,me.LK,G(ivk))),parts:n});
 if(error)throw Error(error.message)}

async function play(id){
 let v=await get('vm',id);const loc=!!v;if(!v)v=(await sb.from('videos').select('*').eq('id',id).single()).data;
 if(!v)throw Error('Vidéo introuvable.');v.t=v.title;v.d=v.descr;
 const CK=await S.unwrapKey('raw',unb64(v.wk),me.LK,G(unb64(v.ivk)),AES,false,['decrypt']),out=[];
 if(loc&&v.h&&await v.h.requestPermission({mode:'read'})!=='granted')throw Error('Autorise l’accès au dossier pour lire la vidéo.');
 let dn=0;await pool(3,[...Array(v.parts).keys()],async i=>{
  let d;if(loc){if(v.h){try{d=await(await v.h.getFileHandle(i+'.vchunk')).getFile()}catch{throw Error('Morceau introuvable dans le dossier : retire la vidéo puis retélécharge-la.')}}else{const c=await get('dl',id+'/'+i);if(!c)throw Error('Fichier hors ligne incomplet : retire-le puis retélécharge-le.');d=c.b}}
  else{const x=await sb.storage.from('videos').download(id+'/'+i);if(x.error)throw Error(x.error.message);d=x.data}
  const b=await d.arrayBuffer();out[i]=new Blob([await S.decrypt(G(new Uint8Array(b,0,12)),CK,b.slice(12))]);flash(`Chargement ${Math.round(++dn/v.parts*100)} %…`,'i')})
 flash('');const url=URL.createObjectURL(new Blob(out,{type:v.mime}));
 const m=document.createElement('div');m.className='modal';m.id='mo';m.dataset.url=url;
 m.innerHTML=`<div><video controls autoplay src="${url}"></video><h2 style="margin-top:14px">${esc(v.t)}</h2><p style="color:var(--m)">${esc(v.d||'')}</p><button class="btn s" data-a="close">Fermer</button></div>`;
 document.body.appendChild(m)}
function closeM(){const m=$('#mo');if(!m)return;const vd=m.querySelector('video');vd.pause();vd.removeAttribute('src');URL.revokeObjectURL(m.dataset.url);m.remove()}

/* ---------- Interface ---------- */
const flash=(t,k='e')=>$('#fl').innerHTML=t?`<div class="msg ${k}">${esc(t)}</div>`:'';
const hue=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return`background:linear-gradient(135deg,hsl(${h} 55% 28%),hsl(${(h+50)%360} 60% 10%))`};
function nav(v){const n=$('#nav');n.classList.remove('hide');
 n.innerHTML=`<button class="${v==='home'?'on':''}" data-a="home">Catalogue</button>${me.role==='admin'&&!me.off?`<button class="${v==='admin'?'on':''}" data-a="admin">Développeur</button>`:''}<button class="${v==='acc'?'on':''}" data-a="acc">Compte</button><button data-a="logout">Déconnexion (${esc(me.u)})</button>`}

function authV(mode){
 $('#nav').classList.add('hide');const setup=mode==='setup';
 $('#v').innerHTML=`<div class="box auth"><h2>${setup?'Compte développeur':mode==='up'?'Inscription':'Connexion'}</h2>
 ${setup?'<div class="msg">Première ouverture : crée ici ton compte développeur. Il te permettra d’ajouter des vidéos et de gérer les inscrits.</div>':`<div class="tabs"><button class="btn ${mode==='in'?'':'s'}" data-a="m-in">Connexion</button><button class="btn ${mode==='up'?'':'s'}" data-a="m-up">Inscription</button></div>`}
 <label>Identifiant</label><input id="u" autocomplete="username"><label>Mot de passe (8 caractères minimum)</label><input id="p" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}">
 ${mode==='in'?'':'<label>Confirmer le mot de passe</label><input id="p2" type="password" autocomplete="new-password">'}
 <button class="btn" id="go" style="width:100%" data-a="${setup?'setup':mode==='up'?'signup':'signin'}">${setup?'Créer le compte':mode==='up'?'Créer mon compte':'Se connecter'}</button></div>`}

async function homeV(){nav('home');
 const loc=await all('vm'),dls=new Set(loc.map(x=>x.id));
 const vs=me.off?loc.map(v=>({...v,t:v.title,d:v.descr})):await vids();
 $('#v').innerHTML=`${me.off?'<div class="msg">Mode hors ligne : seules les vidéos téléchargées sont disponibles.</div>':''}<h2>Catalogue</h2>${vs.length?`<div class="grid">${vs.map(v=>`<div class="card" data-a="play" data-id="${v.id}">${v.cover?`<img class="th" src="${esc(v.cover)}" alt="">`:`<div class="th" style="${hue(v.id)}">▶</div>`}<div class="i"><b>${esc(v.t)}</b><small>${esc((v.d||'').slice(0,80))}</small><div style="margin-top:8px">${dls.has(v.id)?`<button class="btn d sm" data-a="dlrm" data-id="${v.id}">Retirer du hors ligne</button>`:`<button class="btn s sm" data-a="dl" data-id="${v.id}">⬇ Hors ligne · ${mo(v.size)}</button>`}</div></div></div>`).join('')}</div>`:`<div class="box">Aucune vidéo pour l’instant.${me.role==='admin'&&!me.off?' Ouvre l’onglet Développeur pour en publier une.':''}</div>`}`}

const stl={ok:'Actif',wait:'En attente',blocked:'Bloqué'};
const urow=x=>`<tr><td>${esc(x.u)}</td><td>${x.role==='admin'?'Développeur':'Membre'}</td><td>${stl[x.st]}</td><td>${new Date(x.d).toLocaleDateString('fr-FR')}</td><td>${x.id===me.id?'':`${x.st==='wait'?`<button class="btn sm" data-a="uok" data-id="${x.id}">Approuver</button> `:''}<button class="btn s sm" data-a="ublock" data-id="${x.id}">${x.st==='blocked'?'Débloquer':'Bloquer'}</button> <button class="btn d sm" data-a="udel" data-id="${x.id}">Supprimer</button>`}</td></tr>`;

async function adminV(){nav('admin');picked=null;
 const vs=await vids(),us=await usrs();
 $('#v').innerHTML=`<div class="box"><h2>Publier une vidéo</h2>
 <div class="stp" data-s="1"><p>Étape 1 sur 4 · Choisis le fichier vidéo (n’importe quel format)</p><div class="drop" id="dz">Glisse un fichier ici ou clique pour le choisir</div><input type="file" id="fi" class="hide"><button class="btn" id="n1" data-a="nx" data-id="2" disabled>Suivant</button></div>
 <div class="stp hide" data-s="2"><p>Étape 2 sur 4 · Titre et description</p><label>Titre</label><input id="vt"><label>Description</label><textarea id="vd" rows="3"></textarea><button class="btn s" data-a="nx" data-id="1">Retour</button> <button class="btn" data-a="nx" data-id="3">Suivant</button></div>
 <div class="stp hide" data-s="3"><p>Étape 3 sur 4 · Affiche du film (facultatif)</p><div class="drop" id="cz">Clique pour choisir une image</div><input type="file" id="ci" accept="image/*" class="hide"><button class="btn s" data-a="nx" data-id="2">Retour</button> <button class="btn" data-a="nx" data-id="4">Suivant</button></div>
 <div class="stp hide" data-s="4"><p>Étape 4 sur 4 · Vérifier et publier</p><div id="rc"></div><button class="btn s" data-a="nx" data-id="3">Retour</button> <button class="btn" data-a="pub">Publier</button> <small id="ps" style="color:var(--m)"></small></div></div>
 <div class="box"><h2>Vidéos (${vs.length})</h2>${vs.length?`<div class="tw"><table>${vs.map(v=>`<tr><td>${esc(v.t)}</td><td>${mo(v.size)}</td><td><button class="btn d sm" data-a="vdel" data-id="${v.id}">Supprimer</button></td></tr>`).join('')}</table></div>`:'Aucune vidéo publiée.'}</div>
 <div class="box"><h2>Inscrits (${us.length})</h2><div class="tw"><table><tr><th>Identifiant</th><th>Rôle</th><th>Statut</th><th>Inscrit le</th><th></th></tr>${us.map(urow).join('')}</table></div></div>`;
 const dz=$('#dz'),fi=$('#fi');
 const pick=f=>{if(!f)return;picked=f;$('#n1').disabled=false;if(!document.createElement('video').canPlayType(f.type||'video/mp4'))flash('Ce format risque de ne pas se lire dans le navigateur : préfère un MP4 (H.264).');dz.textContent='📁 '+f.name+' ('+mo(f.size)+')';if(!$('#vt').value)$('#vt').value=f.name.replace(/\.[^.]+$/,'')};
 dz.onclick=()=>fi.click();fi.onchange=()=>pick(fi.files[0]);
 dz.ondragover=e=>{e.preventDefault();dz.classList.add('h')};dz.ondragleave=()=>dz.classList.remove('h');
 dz.ondrop=e=>{e.preventDefault();dz.classList.remove('h');pick(e.dataTransfer.files[0])};
 const cz=$('#cz'),ci=$('#ci');cz.onclick=()=>ci.click();ci.onchange=()=>{if(ci.files[0])cz.textContent='🖼 '+ci.files[0].name}}

function accV(){nav('acc');
 $('#v').innerHTML=`<div class="box" style="max-width:420px"><h2>Mon compte</h2><p style="color:var(--m)">Connecté en tant que <b style="color:var(--t)">${esc(me.u)}</b> (${me.role==='admin'?'développeur':'membre'}).</p>
 <label>Mot de passe actuel</label><input id="o" type="password" autocomplete="current-password"><label>Nouveau mot de passe</label><input id="n" type="password" autocomplete="new-password"><label>Confirmer le nouveau mot de passe</label><input id="n2" type="password" autocomplete="new-password">
 <button class="btn" id="go" data-a="chpw">Changer le mot de passe</button></div>`}

const checkPw=(p,p2)=>{if(p.length<8)throw Error('Le mot de passe doit faire au moins 8 caractères.');if(p!==p2)throw Error('Les deux mots de passe ne correspondent pas.')};
const checkId=u=>{if(!/^[a-z0-9_-]{3,24}$/.test(u))throw Error('Identifiant : 3 à 24 caractères (lettres, chiffres, _ -).')};

async function act(a,id,el){
 flash('');if(el)el.disabled=true;
 try{switch(a){
  case'm-in':authV('in');break;
  case'm-up':authV('up');break;
  case'signin':await login(val('u'),val('p'));await homeV();break;
  case'signup':{const u=val('u').trim().toLowerCase();checkId(u);checkPw(val('p'),val('p2'));
   await mkUser(u,val('p'));authV('in');flash('Compte créé. Le développeur doit valider ton accès avant ta première connexion.','o');break}
  case'setup':{const u=val('u').trim().toLowerCase();checkId(u);checkPw(val('p'),val('p2'));
   await mkUser(u,val('p'));await login(u,val('p'));await adminV();break}
  case'logout':closeM();me=null;try{await sb.auth.signOut()}catch{}await boot();break;
  case'home':await homeV();break;
  case'admin':await adminV();break;
  case'acc':accV();break;
  case'play':await play(id);break;
  case'dl':{let root=null;
   if(window.showDirectoryPicker){try{const s=await get('prof','#dir');root=s&&s.h;
    if(!root||await root.requestPermission({mode:'readwrite'})!=='granted'){root=await showDirectoryPicker({id:'violette',mode:'readwrite',startIn:'downloads'});await put('prof',{u:'#dir',h:root})}}catch{root=null}}
   try{await navigator.storage.persist()}catch{}
   const{data:v,error}=await sb.from('videos').select('*').eq('id',id).single();if(error)throw Error(error.message);
   let dir=null;if(root){const b=await root.getDirectoryHandle('Violette Stream',{create:true});dir=await b.getDirectoryHandle((v.title.replace(/[\\/:*?"<>|]+/g,'').trim()||'video')+' '+id.slice(0,4),{create:true})}
   let dn=0;await pool(3,[...Array(v.parts).keys()],async i=>{
    const x=await sb.storage.from('videos').download(id+'/'+i);if(x.error)throw Error(x.error.message);
    if(dir){const w=await(await dir.getFileHandle(i+'.vchunk',{create:true})).createWritable();await w.write(x.data);await w.close()}else await put('dl',{k:id+'/'+i,b:x.data});
    flash(`Téléchargement ${Math.round(++dn/v.parts*100)} %…`,'i')});
   await put('vm',dir?{...v,h:dir}:v);await homeV();flash(dir?'Téléchargée dans le dossier « Violette Stream ».':'Disponible hors ligne.','o');break}
  case'dlrm':{const v=await get('vm',id);
   if(v.h){try{if(await v.h.requestPermission({mode:'readwrite'})==='granted'){for(let i=0;i<v.parts;i++)await v.h.removeEntry(i+'.vchunk');try{await v.h.remove({recursive:true})}catch{}}}catch{}}
   else for(let i=0;i<v.parts;i++)await del('dl',id+'/'+i);
   await del('vm',id);await homeV();break}
  case'nx':{const n=+id;if(n>1&&!picked)throw Error('Choisis d’abord un fichier.');if(n>2&&!val('vt').trim())throw Error('Ajoute un titre.');
   if(n===4)$('#rc').innerHTML=`<p><b style="color:var(--t)">${esc(val('vt'))}</b></p><p>${esc(picked.name)} · ${mo(picked.size)}<br>${$('#ci').files[0]?'Avec affiche':'Sans affiche'}</p>`;
   document.querySelectorAll('.stp').forEach(e=>e.classList.toggle('hide',e.dataset.s!=n));break}
  case'close':closeM();break;
  case'pub':{if(!picked)throw Error('Choisis d’abord une vidéo.');const t=val('vt').trim();if(!t)throw Error('Ajoute un titre.');
   await publish(picked,t,val('vd').trim(),$('#ci').files[0]?await cover($('#ci').files[0]):null,s=>$('#ps').textContent=s);await adminV();flash('Vidéo publiée.','o');break}
  case'vdel':if(confirm('Supprimer cette vidéo ?')){const{data:v}=await sb.from('videos').select('parts').eq('id',id).single();
   await sb.storage.from('videos').remove(Array.from({length:v.parts},(_,i)=>id+'/'+i));await sb.from('videos').delete().eq('id',id);await adminV()}break;
  case'uok':{const{data:r}=await sb.from('profiles').select('pub').eq('id',id).single(),k=await S.importKey('spki',unb64(r.pub),RSA,false,['wrapKey']);
   const{error}=await sb.from('profiles').update({lk:b64(await S.wrapKey('raw',me.LK,k,RSA)),st:'ok'}).eq('id',id);if(error)throw Error(error.message);await adminV();flash('Accès accordé.','o');break}
  case'ublock':{const{data:r}=await sb.from('profiles').select('st,lk').eq('id',id).single();
   await sb.from('profiles').update({st:r.st==='blocked'?(r.lk?'ok':'wait'):'blocked'}).eq('id',id);await adminV();break}
  case'udel':if(confirm('Supprimer ce compte ?')){const{error}=await sb.rpc('delete_user',{uid:id});if(error)throw Error(error.message);await adminV()}break;
  case'chpw':{const n=val('n');checkPw(n,val('n2'));
   const{data:r}=await sb.from('profiles').select('wp,salt,iv').eq('id',me.id).single();
   try{await unwrapPriv({wp:unb64(r.wp),salt:unb64(r.salt),iv:unb64(r.iv)},val('o'))}catch{throw Error('Le mot de passe actuel est incorrect.')}
   const w=await wrapPriv(me.priv,n),{error}=await sb.auth.updateUser({password:await authPw(me.u,n)});if(error)throw Error(error.message);
   await sb.from('profiles').update({wp:b64(w.wp),salt:b64(w.salt),iv:b64(w.iv)}).eq('id',me.id);accV();flash('Mot de passe modifié.','o');break}
 }}catch(e){flash(e.message||'Une erreur est survenue.')}
 if(el)el.disabled=false}

document.addEventListener('click',e=>{
 if(e.target.id==='mo')return closeM();
 const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&$('#go'))$('#go').click();if(e.key==='Escape')closeM()});

async function boot(){
 if(!S){$('#v').innerHTML='<div class="box auth">Ce navigateur ne permet pas le chiffrement. Ouvre la page en HTTPS ou depuis un fichier local.</div>';return}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>caches.open('violette-v1')).then(c=>{c.add(location.href.split('#')[0]);c.add(CDN)}).catch(()=>{});
 if(!navigator.onLine||!sb){authV('in');flash('Mode hors ligne : connecte-toi pour accéder à tes vidéos téléchargées.','i');return}
 try{const{data,error}=await sb.rpc('has_admin');if(error)throw error;authV(data?'in':'setup')}
 catch(e){authV('in');flash('Connexion à Supabase impossible ('+(e.message||'')+'). Tu peux quand même te connecter pour utiliser tes vidéos hors ligne.')}}
boot();
</script></body></html>
